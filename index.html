<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миша</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a73e8;
            font-family: 'Arial', sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #333;
            font-size: 48px;
            margin: 0 0 20px 0;
            animation: fadeIn 1s ease-in;
        }
        #ukraine-time {
            font-size: 28px;
            color: #1a73e8;
            font-weight: bold;
            margin-top: 10px;
        }
        #ukraine-date {
            font-size: 18px;
            color: #555;
            margin-top: 5px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет Миша 👋</h1>
        <div id="ukraine-time">--:--:--</div>
        <div id="ukraine-date"></div>
    </div>
    <script>
        function updateUkraineTime() {
            const now = new Date();
            // Ukraine is UTC+3 (EET/EEST - Europe/Kyiv)
            const ukraineOffset = 3 * 60; // minutes
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            const ukraineTime = new Date(utc + ukraineOffset * 60000);

            const h = String(ukraineTime.getHours()).padStart(2, '0');
            const m = String(ukraineTime.getMinutes()).padStart(2, '0');
            const s = String(ukraineTime.getSeconds()).padStart(2, '0');

            const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
            const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

            document.getElementById('ukraine-time').textContent = `${h}:${m}:${s}`;
            document.getElementById('ukraine-date').textContent =
                `${days[ukraineTime.getDay()]}, ${ukraineTime.getDate()} ${months[ukraineTime.getMonth()]} ${ukraineTime.getFullYear()} — Украина (UTC+3)`;
        }
        updateUkraineTime();
        setInterval(updateUkraineTime, 1000);
    </script>
</body>
</html>
